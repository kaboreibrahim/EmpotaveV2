{% extends 'layouts/base.html' %}
{% load i18n %}
{% block content %}
<div class="container">
    <h2 class="h4 mb-4">{% trans "Confirmer la Suppression" %}</h2>
    <p>{% trans "Êtes-vous sûr de vouloir supprimer le conteneur" %} "{{ object }}" ?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">{% trans "Supprimer" %}</button>
        <a href="{% url 'view_conteneurs' dossier_id=object.dossier.id %}" class="btn btn-secondary">{% trans "Annuler" %}</a>
    </form>
</div>
{% endblock %}
