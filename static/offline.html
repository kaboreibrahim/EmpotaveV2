<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hors ligne — Oils of Africa</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif;
    background: #f7f9fc;
    color: #191c1e;
    padding: 24px;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #101412; color: #e2e5e2; }
  }
  .card {
    text-align: center;
    max-width: 360px;
  }
  img {
    width: 88px;
    height: 88px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    line-height: 1.5;
    opacity: 0.75;
    margin: 0 0 24px;
  }
  button {
    font: inherit;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 24px;
    border-radius: 8px;
    border: none;
    background: #00450d;
    color: #fff;
    cursor: pointer;
  }
  button:active {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/static/img/icons/icon-192.png" alt="" />
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de joindre le serveur pour le moment. Vérifiez votre connexion puis réessayez.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
