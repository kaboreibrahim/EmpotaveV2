{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Erreur 404 - Système d'Empotage</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #faf9fd; color: #036f09; overflow-x: hidden; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .maritime-gradient { background: radial-gradient(circle at 50% 50%, #d6e3ff 0%, #faf9fd 70%); }
    .container-float { animation: float 6s ease-in-out infinite; }
    @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(2deg); }
    }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 overflow-hidden">
<div class="fixed inset-0 maritime-gradient -z-10"></div>
<main class="max-w-4xl w-full flex flex-col md:flex-row items-center gap-12 relative z-10">
<div class="w-full md:w-1/2 flex justify-center items-center relative">
<div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center">
<div class="absolute inset-0 border border-[#002046]/5 rounded-full scale-100"></div>
<div class="absolute inset-0 border border-[#002046]/10 rounded-full scale-125"></div>
<div class="container-float">
<span class="material-symbols-outlined text-[#002046]" style="font-size:160px;">directions_boat_filled</span>
</div>
<div class="absolute -top-4 -right-4 p-3 bg-white border border-[#c4c6cf] rounded-lg shadow-sm animate-bounce">
<span class="material-symbols-outlined text-[#ba1a1a] text-[32px]">location_off</span>
</div>
</div>
</div>
<div class="w-full md:w-1/2 text-center md:text-left space-y-6">
<div class="space-y-2">
<span class="font-mono text-xs text-[#002046] tracking-[0.2em] uppercase opacity-60">Erreur 404</span>
<h1 class="text-3xl lg:text-4xl text-[#002046] leading-tight font-black">Oups ! Cette destination n'existe pas.</h1>
<div class="h-1 w-12 bg-[#002046] rounded-full hidden md:block"></div>
</div>
 
<div class="pt-4 flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
<a class="group flex items-center justify-center gap-2 px-6 py-3 bg-[#002046] text-white font-semibold rounded-lg transition-all hover:bg-[#1b365d] active:scale-95 shadow-sm" href="/">
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:-translate-x-1">arrow_back</span>
Retour au tableau de bord
</a>
</div>
</div>
</main>
<div class="fixed top-8 left-8 flex items-center gap-3 select-none">
<img src="{% static 'img/logo.png' %}" alt="Logo" class="h-9 w-auto object-contain"/>
<span class="text-[#002046] font-black tracking-tight text-lg">Oils of Africa</span>
</div>
</body>
</html>
