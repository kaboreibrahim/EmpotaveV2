{% if photo %}
<a href="{{ photo.url }}" target="_blank" rel="noopener"
   data-lightbox-src="{{ photo.url }}" data-lightbox-label="{{ label }}"
   class="relative block aspect-square rounded-lg overflow-hidden border border-outline-variant hover:border-primary transition-colors">
  <div class="skeleton-block absolute inset-0" aria-hidden="true"></div>
  <div class="hidden w-full h-full items-center justify-center text-on-surface-variant opacity-50 fallback-icon">
    <span class="material-symbols-outlined">broken_image</span>
  </div>
  <img src="{{ photo.url }}" alt="{{ label }}" loading="lazy" class="relative w-full h-full object-cover opacity-0 transition-opacity duration-300"
       onload="this.previousElementSibling.previousElementSibling.remove(); this.classList.remove('opacity-0');"
       onerror="this.previousElementSibling.previousElementSibling.remove(); this.previousElementSibling.classList.replace('hidden', 'flex'); this.remove();">
</a>
{% else %}
<div class="aspect-square rounded-lg border border-dashed border-outline-variant flex items-center justify-center text-on-surface-variant opacity-50">
  <span class="material-symbols-outlined">image_not_supported</span>
</div>
{% endif %}
<p class="text-label-sm text-on-surface-variant text-center truncate">{{ label }}</p>
