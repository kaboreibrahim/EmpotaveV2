<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="x-apple-disable-message-reformatting">
<title>{% block title %}Oils of Africa{% endblock %}</title>
<style>
    body, table, td { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 0; background-color: #f2f4f2; }
    @media only screen and (max-width: 600px) {
        .container { width: 100% !important; border-radius: 0 !important; }
        .px-responsive { padding-left: 24px !important; padding-right: 24px !important; }
    }
</style>
</head>
<body style="margin:0;padding:0;background-color:#f2f4f2;">
<span style="display:none;font-size:1px;color:#f2f4f2;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{% block preheader %}{% endblock %}</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f2;padding:32px 0;">
<tr>
<td align="center">
<table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e0e3e0;">
<tr>
<td style="background-color:#00450d;padding:28px 40px;text-align:center;">
<span style="font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:0.5px;">Oils of Africa</span>
<div style="font-size:12px;color:#b9d6a5;margin-top:4px;letter-spacing:1px;text-transform:uppercase;">Gestion des Opérations</div>
</td>
</tr>
<tr>
<td class="px-responsive" style="padding:40px;">
{% block content %}{% endblock %}
</td>
</tr>
<tr>
<td style="background-color:#f7f9f7;padding:24px 40px;text-align:center;border-top:1px solid #e0e3e0;">
<p style="margin:0;font-size:12px;color:#717a6d;">&copy; {% now "Y" %} Oils of Africa — Gestion Operation.</p>
<p style="margin:4px 0 0;font-size:12px;color:#717a6d;">Cet e-mail a été envoyé automatiquement, merci de ne pas y répondre.</p>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
